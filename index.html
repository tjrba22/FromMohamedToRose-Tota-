<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO ROSE AND ONLY ROSE</title>
    <style>
        @font-face {
            font-family: 'MyFont';
            src: url('FONT/tharwat-emara-ruqaa-light.ttf') format('truetype');
        }

        @font-face {
            font-family: 'MyFont1';
            src: url('FONT/Baskerville Old Face Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'MyFont2';
            src: url('FONT/Stadella.ttf') format('truetype');
        }

        @font-face {
            font-family: 'MyFont3';
            src: url('FONT/decotype-naskh-swashes.ttf') format('truetype');
        }

        @font-face {
            font-family: 'MyFont4';
            src: url('FONT/BRUSHSCI.TTF') format('truetype');
        }

html, body {
    margin: 0;
    padding: 0;
}

html {
    background-color: #f0eee1;
    background-image: url('IMAGES/Background/bg.svg');
    background-repeat: repeat-y;
    background-position: center;
    background-size: cover;
}

body {
    background: none;
    font-family: 'MyFont', sans-serif;
    font-size: 100%;
}

.page {
    max-width: 500px;
    margin: 0 auto;
    background-color: transparent;
    padding: 0;
}

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        p {
            font-family: 'MyFont', sans-serif;
            text-align: justify;
            text-align-last: center;
            width: 85%;
            margin: 0 auto;
            line-height: 1.8;
            color: #86925C;
            font-size: 100%;
        }

        hr {
            max-width: 80%;
        }

        @media (max-width: 500px) {
            p {
                width: 70%;
                font-size: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div align="center">
            <!-- Header -->
            <img src="IMAGES/Headers/Header%20Flowers.svg" alt="Header Image" width="100%">
            <p style="margin: 25% 0;"></p>

            <p style="font-family: 'MyFont1'; font-size: 120%;">Specially for</p>

            <p style="font-family: 'MyFont2'; font-size: 1200%; margin: 10% 0;">Tota</p>

            <p style="margin: 100% 0;"></p>

            <p style="font-family: 'MyFont1'; font-size: 200%; margin: -5%;">April</p>
            <p style="font-family: 'MyFont1'; font-size: 350%; margin: -5%;">23</p>
            <p style="font-family: 'MyFont1'; font-size: 200%; margin: -5%;">2026</p>

            <p style="margin: 80%;"></p>

            <p style="font-family: 'MyFont3'; font-size: 180%; color: #EEA0C7;">الى صديقتي المفضلة</p>
            <hr width="80%" size="2" color="#EEA0C7">

            <p style="font-family: 'MyFont'; font-size: 150%; color: #CE3E64; margin: 5%;">
             شكد ما تكون الايام عصيبة عليج تذكري اني وياج وراح ابقى كذلك...
            </p>

            <hr width="80%" size="2" color="#EEA0C7">
            <p style="font-family: 'MyFont4'; font-size: 180%; color: #EEA0C7;">Your bestie</p>

            <p style="margin: 50%;"></p>

            <p style="text-align-last: justify; margin: 5%; font-family: 'MyFont'; font-size: 100%; color: #B3B8AD;">
                رَأَيتُ الدَهرَ مُختَلِفاً يَدورُ *** فَلا حُزنٌ يَدومُ وَلا سُرورُ<br>
                وَقَد بَنَتِ المُلوكُ بِهِ قَصوراً *** فَلَم تَبقَ المُلوكُ وَلا القُصورُ
            </p>

            <p style="margin: 50%;"></p>

            <a href="https://www.youtube.com/watch?v=uTZM6LsiuCA&list=RDuTZM6LsiuCA&start" target="_blank">
                <img src="IMAGES/Roses/Roses.svg" alt="Roses Image" width="50%">
            </a>
            <p style="margin: 20%;"></p>

            <p onclick="var t=['اني اشوفج مثل هاي الوردة باللون الوردي حيث انو شكد اكو ورد بالعالم لكن تبقين انتي اكثر وردة مميزة عندي <br>(اضغطي هنا)','انتي افضل شخص مر بحياتي واريدج تعرفين هل شي تره فرحج فرحي وحزنج خزني فا باقي فرانحة احسن لج <br>(اضغطي هنا)','يومي هاذا الج فقط من رجعت لحد ما دزيته اني جنت اسوي بهذا الج وانتي وبس (ما اكدر احط ايموجي غمزة) <br>(اضغطي هنا)','اذا ضغطي على البوكيه في حاجة تنتظرج']; var i=parseInt(this.getAttribute('data-i'))||0; i=(i+1)%t.length; this.innerHTML=t[i]; this.setAttribute('data-i',i);" data-i="0" style="font-size: 120%; cursor: pointer;">اضغطي هنا</p>
            <p style="margin: 100%;"></p>

            <!-- Footer -->
            <img src="IMAGES/Footer/Footer%20Flowers.svg" alt="Footer Image" width="100%">
        </div>
    </div>
</body>
</html>
